<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Merah -->
    <g fill="#D62828">
        <rect x="80" y="40" width="10" height="28" rx="5" transform="rotate(20 80 40)"></rect>
        <rect x="310" y="70" width="10" height="28" rx="5" transform="rotate(40 310 70)"></rect>
        <rect x="620" y="60" width="10" height="28" rx="5" transform="rotate(30 620 60)"></rect>
        <rect x="900" y="50" width="10" height="28" rx="5" transform="rotate(25 900 50)"></rect>
    </g>

    <!-- Putih -->
    <g fill="white">
        <rect x="180" y="150" width="10" height="28" rx="5" transform="rotate(-25 180 150)"></rect>
        <rect x="470" y="180" width="10" height="28" rx="5" transform="rotate(-15 470 180)"></rect>
        <rect x="760" y="150" width="10" height="28" rx="5" transform="rotate(-30 760 150)"></rect>
        <rect x="1040" y="170" width="10" height="28" rx="5" transform="rotate(-20 1040 170)"></rect>
    </g>

</svg>